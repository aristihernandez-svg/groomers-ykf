<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Skycare — Sioux Lookout Shopping</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0B1120;--bg2:#111827;--bg3:#1a2235;--glass:rgba(255,255,255,0.05);--glass2:rgba(255,255,255,0.08);--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);--t1:#f0f4ff;--t2:#9aa5be;--t3:#5a6478;--accent:#2ECC8A;--green:#27AE60;--red:#E74C3C;--radius:16px;--radius-sm:10px}
body{background:var(--bg);color:var(--t1);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;padding-bottom:100px}
.bar{position:sticky;top:0;z-index:50;background:var(--bg2);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;gap:12px}
.bar-title{font-size:16px;font-weight:800;color:var(--t1);flex:1}
.swipe-wrap{position:relative;overflow:hidden}
.swipe-action-left,.swipe-action-right{position:absolute;top:0;bottom:0;width:90px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;cursor:pointer;text-align:center;padding:0 6px}
.swipe-action-left{left:0;background:linear-gradient(135deg,#8B1A1A,#E74C3C)}
.swipe-action-right{right:0;background:linear-gradient(135deg,#1d4ed8,#2563eb)}
.item-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.15s,transform 0.2s ease;position:relative;background:var(--bg)}
.item-row:active{background:var(--glass)}
.item-row.tobuy .item-name{color:var(--accent)}
.swipe-wrap.open-left .item-row{transform:translateX(90px)}
.swipe-wrap.open-right .item-row{transform:translateX(-90px)}
.cb{width:24px;height:24px;border-radius:6px;border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;transition:all 0.15s}
.cb.on{background:var(--accent);border-color:var(--accent);color:#fff}
.item-name{font-size:15px;font-weight:600;color:var(--t1)}
.item-notes{font-size:12px;color:var(--t3);margin-top:2px}
.badge{display:inline-block;background:rgba(46,204,138,0.2);color:var(--accent);border-radius:20px;padding:2px 8px;font-size:11px;font-weight:700;margin-left:6px}
.empty{text-align:center;padding:60px 24px;color:var(--t3)}
.empty-icon{font-size:48px;margin-bottom:12px}
.fab{position:fixed;bottom:28px;right:20px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#1A9A63);border:none;color:#fff;font-size:26px;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:100}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#27AE60;color:#fff;padding:12px 24px;border-radius:40px;font-size:14px;font-weight:700;z-index:999;opacity:0;transition:opacity 0.3s;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,0.4)}
.toast.show{opacity:1}
/* Add form */
.form-wrap{padding:16px}
label{display:block;font-size:12px;color:var(--t2);font-weight:600;margin-bottom:5px;margin-top:14px}
label:first-of-type{margin-top:0}
input,textarea{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:11px 13px;color:var(--t1);font-size:15px;font-family:inherit;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:none;min-height:60px;font-size:14px}
.save-btn{display:block;width:100%;margin-top:16px;padding:14px;border-radius:var(--radius-sm);border:none;background:linear-gradient(135deg,var(--accent),#1A9A63);color:#fff;font-size:15px;font-weight:800;cursor:pointer}
.save-btn:active{opacity:0.8}
.cancel-btn{display:block;width:100%;margin-top:10px;padding:12px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:transparent;color:var(--t2);font-size:14px;font-weight:600;cursor:pointer}
.section-header{padding:10px 16px 4px;font-size:10px;font-weight:700;color:var(--t3);letter-spacing:1.5px;text-transform:uppercase;border-bottom:1px solid var(--border)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:200;align-items:center;justify-content:center;padding:24px}
.modal-overlay.open{display:flex}
.modal-card{background:var(--bg2);border-radius:var(--radius);padding:22px;width:100%;max-width:320px}
.modal-card h3{font-size:16px;font-weight:800;margin-bottom:8px}
.modal-card p{font-size:13px;color:var(--t2);margin-bottom:20px;line-height:1.5}
.modal-del-btn{display:block;width:100%;padding:13px;border-radius:var(--radius-sm);border:none;background:var(--red);color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:10px}
.modal-cancel-btn{display:block;width:100%;padding:12px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:transparent;color:var(--t2);font-size:14px;font-weight:600;cursor:pointer}
</style>
</head>
<body>

<div class="bar">
  <button onclick="goBack()" style="background:none;border:none;color:#2ECC8A;font-size:24px;line-height:1;cursor:pointer;padding:0 4px;flex-shrink:0">‹</button>
  <img src="cars/Skycare_logo-removebg-preview.png" style="height:22px;filter:brightness(0) invert(1)" alt="Skycare">
  <span class="bar-title">Sioux Lookout Shopping</span>
  <span id="cartCount" style="background:var(--accent);color:#fff;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700;display:none"></span>
</div>

<div id="app"></div>
<button class="fab" onclick="showAddForm()" title="Add item">+</button>
<div class="toast" id="toast"></div>

<div class="modal-overlay" id="delModal">
  <div class="modal-card">
    <h3>Remove item?</h3>
    <p id="delModalMsg"></p>
    <button class="modal-del-btn" onclick="confirmDelete()">🗑 Yes, remove it</button>
    <button class="modal-cancel-btn" onclick="closeDelModal()">Cancel</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyA7BHDcP-PVTpsaNu9TTWCnChfI0bnOLi8",
  authDomain:"groomer-ykf.firebaseapp.com",
  projectId:"groomer-ykf",
  storageBucket:"groomer-ykf.firebasestorage.app",
  messagingSenderId:"384366195372",
  appId:"1:384366195372:web:35d38ffbc947188d4a6509"
});
const db = firebase.firestore();

let catalog = [];   // {id, item, notes, store}  — only Sioux Lookout items
let shopState = {}; // {fsKey: {checked, status, qty, source}}
let view = 'list';  // 'list' | 'add'
let editingId = null;   // set while the add/edit form is editing an existing item
let pendingDelId = null; // set while the delete-confirm modal is open

// Same stores as Kitchener — items get bought here and shipped up on a
// company flight, Sioux Lookout doesn't have these stores locally.
const STORES = ['Zehrs','Costco','A1 Cash & Carry','Home Depot','Canadian Tire','Monarch Oil','Supplier'];

// Live catalog listener — items located at Sioux Lookout (cabinet filter)
db.collection('shoppingCatalog').onSnapshot(snap => {
  catalog = snap.docs
    .map(d => ({id:d.id, ...d.data()}))
    .filter(i => i.cabinet === 'Sioux Lookout' && i.item && !i.deleted);
  render();
});

// Live shopState listener
db.collection('shopState').doc('state').onSnapshot(snap => {
  if(snap.exists) shopState = snap.data() || {};
  render();
});

function fsKey(text) { return String(text).replace(/[.\/]/g, '∙'); }

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

function render() {
  if(view === 'add') { renderAdd(); return; }
  renderList();
}

function renderList() {
  const toBuyCount = catalog.filter(i => shopState[fsKey(i.item)]?.checked).length;
  const cc = document.getElementById('cartCount');
  if(toBuyCount > 0) { cc.textContent = toBuyCount+' to buy'; cc.style.display=''; }
  else cc.style.display='none';

  if(!catalog.length) {
    document.getElementById('app').innerHTML = `<div class="empty">
      <div class="empty-icon">📍</div>
      <p style="font-size:15px;font-weight:600;color:var(--t2)">No Sioux Lookout items yet</p>
      <p style="font-size:13px;margin-top:6px">Tap + to add something you need — it'll be bought in Kitchener and shipped up on the next flight</p>
    </div>`;
    return;
  }

  const toBuy = catalog.filter(i => shopState[fsKey(i.item)]?.checked);
  const rest  = catalog.filter(i => !shopState[fsKey(i.item)]?.checked);

  let html = '';

  if(toBuy.length) {
    html += `<div class="section-header">🛒 To Buy (${toBuy.length})</div>`;
    toBuy.forEach(i => html += itemHtml(i, true));
  }

  if(rest.length) {
    html += `<div class="section-header">📍 Sioux Lookout Items</div>`;
    rest.forEach(i => html += itemHtml(i, false));
  }

  html += `<div style="padding:16px;text-align:center;font-size:12px;color:var(--t3)">Tap an item to add it to the shopping cart ·<br>Swipe right to delete, swipe left to edit</div>`;

  document.getElementById('app').innerHTML = html;
  document.querySelectorAll('.swipe-wrap').forEach(setupSwipe);
}

function itemHtml(item, checked) {
  const key = fsKey(item.item);
  const safeKey  = key.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
  const safeName = item.item.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
  const qty = shopState[key]?.qty || 1;
  const notes = item.notes && String(item.notes) !== 'false' && String(item.notes).trim() ? item.notes : '';
  return `<div class="swipe-wrap">
    <div class="swipe-action-left" onclick="askDelete('${item.id}')">🗑 Delete</div>
    <div class="swipe-action-right" onclick="editItemPrompt('${item.id}')">✏️ Edit</div>
    <div class="item-row ${checked?'tobuy':''}" data-key="${safeKey}" data-name="${safeName}" onclick="toggleItem(this.dataset.key,this.dataset.name)">
      <div class="cb ${checked?'on':''}">${checked?'✓':''}</div>
      <div style="flex:1;min-width:0">
        <div class="item-name">${item.item}${checked?'<span class="badge">To Buy</span>':''}</div>
        ${notes?`<div class="item-notes">${notes}</div>`:''}
      </div>
      ${checked ? `<div onclick="event.stopPropagation()" style="display:flex;align-items:center;gap:0;flex-shrink:0;border:1px solid rgba(46,204,138,0.4);border-radius:20px;overflow:hidden">
        <button data-key="${safeKey}" onclick="event.stopPropagation();changeQty(this.dataset.key,-1)" style="background:none;border:none;color:var(--accent);font-size:18px;font-weight:700;width:32px;height:32px;cursor:pointer;line-height:1">−</button>
        <span style="min-width:22px;text-align:center;font-size:14px;font-weight:700;color:var(--t1)">${qty}</span>
        <button data-key="${safeKey}" onclick="event.stopPropagation();changeQty(this.dataset.key,1)" style="background:none;border:none;color:var(--accent);font-size:18px;font-weight:700;width:32px;height:32px;cursor:pointer;line-height:1">+</button>
      </div>` : ''}
    </div>
  </div>`;
}

// Reveal-then-tap swipe, ported from the main app's setupSwipeTwoWay:
// dragging right reveals Delete (left panel), dragging left reveals Edit
// (right panel). Tapping an already-open row closes it instead of acting.
function setupSwipe(el) {
  let startX=0, currentX=0, active=false;
  const inner = el.querySelector('.item-row');
  if(!inner) return;

  el.addEventListener('touchstart', e=>{
    document.querySelectorAll('.swipe-wrap.open-left,.swipe-wrap.open-right').forEach(w=>{
      if(w!==el) w.classList.remove('open-left','open-right');
    });
    startX = e.touches[0].clientX; active = true;
  }, {passive:true});

  el.addEventListener('touchmove', e=>{
    if(!active) return;
    currentX = e.touches[0].clientX - startX;
    if(Math.abs(currentX) > 8) e.preventDefault();
    inner.style.transform = `translateX(${Math.max(-90,Math.min(90,currentX))}px)`;
  }, {passive:false});

  el.addEventListener('touchend', ()=>{
    if(!active) return; active = false;
    inner.style.transform = '';
    const isOpen = el.classList.contains('open-left') || el.classList.contains('open-right');
    if(isOpen && Math.abs(currentX) < 20) {
      el.classList.remove('open-left','open-right');
    } else if(currentX > 70) {
      el.classList.add('open-left'); el.classList.remove('open-right');
    } else if(currentX < -70) {
      el.classList.add('open-right'); el.classList.remove('open-left');
    } else {
      el.classList.remove('open-left','open-right');
    }
    currentX = 0;
  });
}

function toggleItem(key, name) {
  const cur = shopState[key] || {};
  const nowChecked = !cur.checked;
  const newStatus = nowChecked ? 'To Buy' : 'In Stock';
  const newQty = cur.qty || 1;
  const newSource = nowChecked ? 'siouxlookout' : '';
  shopState[key] = {checked: nowChecked, status: newStatus, qty: newQty, source: newSource};
  render();
  db.collection('shopState').doc('state').set(
    {[key]: {checked: nowChecked, status: newStatus, qty: newQty, source: newSource}},
    {merge: true}
  ).then(() => {
    toast(nowChecked ? `🛒 Added to cart` : `✅ Removed from cart`);
  }).catch(e => {
    console.error('[siouxlookout] Firestore write FAILED:', e);
    toast('❌ Could not sync — check connection');
  });
  if(nowChecked) {
    db.collection('shopNotifQueue').add({
      title: '📍 Sioux Lookout Shopping',
      body: `${name} needs restocking`,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      sent: false
    }).catch(() => {});
  }
}

function changeQty(key, delta) {
  const cur = shopState[key] || {};
  const newQty = Math.max(1, (cur.qty || 1) + delta);
  shopState[key] = {...cur, qty: newQty};
  render();
  db.collection('shopState').doc('state').set(
    {[key]: {...cur, qty: newQty}},
    {merge: true}
  ).catch(e => console.error('[siouxlookout] qty write FAILED:', e));
}

function showAddForm() {
  editingId = null;
  view = 'add';
  render();
}

function editItemPrompt(id) {
  editingId = id;
  view = 'add';
  render();
}

function askDelete(id) {
  const item = catalog.find(i => i.id === id);
  if(!item) return;
  pendingDelId = id;
  document.getElementById('delModalMsg').textContent = `"${item.item}" will be removed from the Sioux Lookout list.`;
  document.getElementById('delModal').classList.add('open');
}

function closeDelModal() {
  pendingDelId = null;
  document.getElementById('delModal').classList.remove('open');
}

function confirmDelete() {
  if(!pendingDelId) return;
  const id = pendingDelId;
  const item = catalog.find(i => i.id === id);
  const name = item ? item.item : '';
  closeDelModal();
  catalog = catalog.filter(i => i.id !== id);
  render();
  // Firestore blocks real deletes app-wide (allow delete: if false) --
  // soft-delete instead, same pattern used everywhere else in this app.
  db.collection('shoppingCatalog').doc(id).update({deleted: true})
    .then(() => toast('🗑 Removed'))
    .catch(() => toast('❌ Could not remove — check connection'));
  if(name) {
    const key = fsKey(name);
    db.collection('shopState').doc('state').update({[key]: firebase.firestore.FieldValue.delete()}).catch(() => {});
  }
}

function renderAdd() {
  const editing = !!editingId;
  const editItem = editing ? catalog.find(i => i.id === editingId) : null;
  const storeOpts = STORES.map(s=>`<option value="${s}" ${editItem && editItem.store===s ? 'selected' : ''}>${s}</option>`).join('');
  document.getElementById('app').innerHTML = `
    <div class="form-wrap">
      <div style="font-size:16px;font-weight:800;color:var(--t1);margin-bottom:4px">${editing ? 'Edit Item' : 'Add Item to List'}</div>
      <div style="font-size:12px;color:var(--t3);margin-bottom:16px">${editing ? 'Changes sync to the shared shopping list right away.' : `This will appear in the Groomers' shopping list under <b style="color:var(--t2)">Sioux Lookout</b>, bought in Kitchener and shipped up on the next flight.`}</div>
      <label>Item name *</label>
      <input type="text" id="inName" placeholder="e.g. Dish soap" value="${editItem ? editItem.item.replace(/"/g,'&quot;') : ''}" autofocus>
      <label>Where to buy *</label>
      <select id="inStore" style="width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:11px 13px;color:var(--t1);font-size:15px;font-family:inherit;outline:none;appearance:none;-webkit-appearance:none">
        <option value="" disabled ${editItem ? '' : 'selected'}>Select a store…</option>
        ${storeOpts}
      </select>
      <label>Notes (optional)</label>
      <textarea id="inNotes" placeholder="Brand, size, any details for the groomer...">${editItem ? (editItem.notes||'') : ''}</textarea>
      <button class="save-btn" onclick="saveItem()">${editing ? '💾 Save Changes' : '➕ Add to Shopping List'}</button>
      <button class="cancel-btn" onclick="cancelAdd()">Cancel</button>
    </div>`;
  setTimeout(()=>document.getElementById('inName')?.focus(), 80);
}

async function saveItem() {
  const name  = (document.getElementById('inName')?.value||'').trim();
  const store = (document.getElementById('inStore')?.value||'').trim();
  const notes = (document.getElementById('inNotes')?.value||'').trim();
  if(!name)  { toast('⚠️ Please enter an item name'); return; }
  if(!store) { toast('⚠️ Please select a store'); return; }

  if(editingId) {
    const id = editingId;
    try {
      await db.collection('shoppingCatalog').doc(id).update({item: name, notes: notes || '', store});
      toast('✅ Item updated!');
      editingId = null;
      view = 'list';
      render();
    } catch(e) {
      toast('❌ Could not save — check connection');
    }
    return;
  }

  const id = name.replace(/[^a-zA-Z0-9]/g,'_').toLowerCase().slice(0,60) + '_' + Date.now();
  try {
    await db.collection('shoppingCatalog').doc(id).set({
      item: name,
      notes: notes || '',
      store: store,
      cabinet: 'Sioux Lookout'
    });
    // Notify via GitHub Actions push (works when main app is closed)
    db.collection('shopNotifQueue').add({
      title: '📍 Sioux Lookout Shopping',
      body: `${name} added to the shopping list`,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      sent: false
    }).catch(() => {});
    toast('✅ Added to shopping list!');
    view = 'list';
    render();
  } catch(e) {
    toast('❌ Could not save — check connection');
  }
}

function cancelAdd() {
  editingId = null;
  view = 'list';
  render();
}

function goBack() {
  // No fallback navigation on purpose -- this page must never be able to
  // walk someone back into the main app's browser history. If the tab
  // can't be closed (most can't, since it wasn't opened by script), the
  // close button simply does nothing further.
  if(view !== 'list') { view = 'list'; render(); return; }
  try{window.close();}catch(e){}
}

render();
</script>
</body>
</html>
