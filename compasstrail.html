<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Skycare — Compass Trail Crew House</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0B1120;--bg2:#111827;--bg3:#1a2235;--glass:rgba(255,255,255,0.05);--glass2:rgba(255,255,255,0.08);--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);--t1:#f0f4ff;--t2:#9aa5be;--t3:#5a6478;--accent:#A855F7;--accent2:#7E3BD1;--green:#27AE60;--red:#E74C3C;--radius:16px;--radius-sm:10px}
body{background:var(--bg);color:var(--t1);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;padding-bottom:100px}
.bar{position:sticky;top:0;z-index:50;background:var(--bg2);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;gap:12px}
.bar-title{font-size:16px;font-weight:800;color:var(--t1);flex:1}
.item-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.15s}
.item-row:active{background:var(--glass)}
.item-row.tobuy .item-name{color:var(--accent)}
.cb{width:24px;height:24px;border-radius:6px;border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;transition:all 0.15s}
.cb.on{background:var(--accent);border-color:var(--accent);color:#fff}
.item-name{font-size:15px;font-weight:600;color:var(--t1)}
.item-notes{font-size:12px;color:var(--t3);margin-top:2px}
.badge{display:inline-block;background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent);border-radius:20px;padding:2px 8px;font-size:11px;font-weight:700;margin-left:6px}
.empty{text-align:center;padding:60px 24px;color:var(--t3)}
.empty-icon{font-size:48px;margin-bottom:12px}
.fab{position:fixed;bottom:28px;right:20px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;font-size:26px;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:100}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#27AE60;color:#fff;padding:12px 24px;border-radius:40px;font-size:14px;font-weight:700;z-index:999;opacity:0;transition:opacity 0.3s;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,0.4)}
.toast.show{opacity:1}
/* Add form */
.form-wrap{padding:16px}
label{display:block;font-size:12px;color:var(--t2);font-weight:600;margin-bottom:5px;margin-top:14px}
label:first-of-type{margin-top:0}
input,textarea{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:11px 13px;color:var(--t1);font-size:15px;font-family:inherit;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:none;min-height:60px;font-size:14px}
.save-btn{display:block;width:100%;margin-top:16px;padding:14px;border-radius:var(--radius-sm);border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:15px;font-weight:800;cursor:pointer}
.save-btn:active{opacity:0.8}
.cancel-btn{display:block;width:100%;margin-top:10px;padding:12px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:transparent;color:var(--t2);font-size:14px;font-weight:600;cursor:pointer}
.section-header{padding:10px 16px 4px;font-size:10px;font-weight:700;color:var(--t3);letter-spacing:1.5px;text-transform:uppercase;border-bottom:1px solid var(--border)}
</style>
</head>
<body>

<div class="bar">
  <button onclick="goBack()" style="background:none;border:none;color:var(--accent);font-size:24px;line-height:1;cursor:pointer;padding:0 4px;flex-shrink:0">‹</button>
  <img src="cars/Skycare_logo-removebg-preview.png" style="height:22px;filter:brightness(0) invert(1)" alt="Skycare">
  <span class="bar-title" id="barTitle"></span>
  <span id="cartCount" style="background:var(--accent);color:#fff;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700;display:none"></span>
</div>

<div id="app"></div>
<button class="fab" onclick="showAddForm()" title="Add item">+</button>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
// ── Which crew house this page is for ──
// crewhouse.html = Thomas Slee (the original link, its items use the 'Crew House' location).
// compasstrail.html is this same page with the Compass Trail settings below swapped in.
const HOUSE = {
  id: 'ct',
  name: 'Compass Trail Crew House',
  short: 'Compass Trail',
  cabinet: 'Compass Trail Crew House',
  source: 'compasstrail',
  suffix: '@CT',
  idSuffix: '__CT',
  accent: '#A855F7', accent2: '#7E3BD1',
  seedFrom: 'Crew House',            // starts as a copy of Thomas Slee's list, then lives on its own
};

firebase.initializeApp({
  apiKey:"AIzaSyA7BHDcP-PVTpsaNu9TTWCnChfI0bnOLi8",
  authDomain:"groomer-ykf.firebaseapp.com",
  projectId:"groomer-ykf",
  storageBucket:"groomer-ykf.firebasestorage.app",
  messagingSenderId:"384366195372",
  appId:"1:384366195372:web:35d38ffbc947188d4a6509"
});
const db = firebase.firestore();
document.title = 'Skycare — ' + HOUSE.name;
document.getElementById('barTitle').textContent = HOUSE.name;
document.documentElement.style.setProperty('--accent', HOUSE.accent);
document.documentElement.style.setProperty('--accent2', HOUSE.accent2);

let catalog = [];   // {id, item, notes, store}  — only this house's items
let shopState = {}; // {key: {checked, status, qty, source}}
let note = null;    // this house's request note (teamData/houseNotes[HOUSE.id])
let view = 'list';  // 'list' | 'add'
let _seedChecked = false;

const STORES = ['Zehrs','Costco','A1 Cash & Carry','Home Depot','Canadian Tire','Monarch Oil','Supplier'];

// Live catalog listener — this house's items (location filter)
db.collection('shoppingCatalog').onSnapshot(snap => {
  const all = snap.docs.map(d => ({id:d.id, ...d.data()}));
  catalog = all.filter(i => i.cabinet === HOUSE.cabinet && i.item && !i.deleted)
    .sort((a, b) => a.item.localeCompare(b.item));
  if (HOUSE.seedFrom && !_seedChecked) { _seedChecked = true; seedList(all); }
  render();
});

// Live shopState listener
db.collection('shopState').doc('state').onSnapshot(snap => {
  if(snap.exists) shopState = snap.data() || {};
  render();
});

// This house's request note (shown as a sticky note in the main app's Cart)
db.collection('teamData').doc('houseNotes').onSnapshot(snap => {
  note = snap.exists ? (snap.data() || {})[HOUSE.id] || null : null;
});

function fsKey(text) { return String(text).replace(/[.\/]/g, '∙'); }
function fsDocId(text) { return fsKey(text).slice(0,400) || ('id'+Date.now()); }
function itemKey(item) { return fsKey(item.item) + HOUSE.suffix; }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// One-time copy of another house's list, the first time this page opens (Compass Trail).
// Only ever ADDS new documents (fixed ids, so running it twice changes nothing) and
// leaves a flag so it never runs again, even if this house's list is emptied later.
async function seedList(all) {
  try {
    const flagRef = db.collection('teamData').doc('houseSetup');
    const flag = await flagRef.get();
    if (flag.exists && (flag.data() || {})[HOUSE.id + 'Seeded']) return;
    if (all.some(i => i.cabinet === HOUSE.cabinet && !i.deleted)) {   // already has items — just mark it
      await flagRef.set({[HOUSE.id + 'Seeded']: true}, {merge: true}); return;
    }
    const src = all.filter(i => i.cabinet === HOUSE.seedFrom && i.item && !i.deleted);
    const batch = db.batch();
    src.forEach(i => batch.set(db.collection('shoppingCatalog').doc(fsDocId(i.item + '__' + (i.store||'') + HOUSE.idSuffix)),
      {item: i.item, store: i.store || '', notes: i.notes || '', url: i.url || '', cabinet: HOUSE.cabinet}));
    batch.set(flagRef, {[HOUSE.id + 'Seeded']: true, [HOUSE.id + 'SeededAt']: new Date().toISOString(), [HOUSE.id + 'SeededCount']: src.length}, {merge: true});
    await batch.commit();
    console.log('[house] copied', src.length, 'items from', HOUSE.seedFrom);
  } catch (e) { console.error('[house] seed failed:', e); }
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

function render() {
  if(view === 'add') { renderAdd(); return; }
  renderList();
}

function renderList() {
  const toBuyCount = catalog.filter(i => shopState[itemKey(i)]?.checked).length;
  const cc = document.getElementById('cartCount');
  if(toBuyCount > 0) { cc.textContent = toBuyCount+' to buy'; cc.style.display=''; }
  else cc.style.display='none';

  if(!catalog.length) {
    document.getElementById('app').innerHTML = `<div class="empty">
      <div class="empty-icon">🏡</div>
      <p style="font-size:15px;font-weight:600;color:var(--t2)">No items yet</p>
      <p style="font-size:13px;margin-top:6px">Tap + to add something you need</p>
    </div>`;
    return;
  }

  const toBuy = catalog.filter(i => shopState[itemKey(i)]?.checked);
  const rest  = catalog.filter(i => !shopState[itemKey(i)]?.checked);

  let html = '';

  if(toBuy.length) {
    html += `<div class="section-header">🛒 To Buy (${toBuy.length})</div>`;
    toBuy.forEach(i => html += itemHtml(i, true));
  }

  if(rest.length) {
    html += `<div class="section-header">🏠 ${esc(HOUSE.short)} items</div>`;
    rest.forEach(i => html += itemHtml(i, false));
  }

  html += `<div style="padding:16px;text-align:center;font-size:12px;color:var(--t3)">Tap an item to add it to the shopping cart ·<br>Tap again to remove it</div>`;

  document.getElementById('app').innerHTML = html;
}

function itemHtml(item, checked) {
  const key = itemKey(item);
  const safeKey  = esc(key);
  const safeName = esc(item.item);
  const qty = shopState[key]?.qty || 1;
  const notes = item.notes && String(item.notes) !== 'false' && String(item.notes).trim() ? item.notes : '';
  return `<div class="item-row ${checked?'tobuy':''}" data-key="${safeKey}" data-name="${safeName}" onclick="toggleItem(this.dataset.key,this.dataset.name)">
    <div class="cb ${checked?'on':''}">${checked?'✓':''}</div>
    <div style="flex:1;min-width:0">
      <div class="item-name">${esc(item.item)}${checked?'<span class="badge">To Buy</span>':''}</div>
      ${notes?`<div class="item-notes">${esc(notes)}</div>`:''}
    </div>
    ${checked ? `<div onclick="event.stopPropagation()" style="display:flex;align-items:center;gap:0;flex-shrink:0;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:20px;overflow:hidden">
      <button data-key="${safeKey}" onclick="event.stopPropagation();changeQty(this.dataset.key,-1)" style="background:none;border:none;color:var(--accent);font-size:18px;font-weight:700;width:32px;height:32px;cursor:pointer;line-height:1">−</button>
      <span style="min-width:22px;text-align:center;font-size:14px;font-weight:700;color:var(--t1)">${qty}</span>
      <button data-key="${safeKey}" onclick="event.stopPropagation();changeQty(this.dataset.key,1)" style="background:none;border:none;color:var(--accent);font-size:18px;font-weight:700;width:32px;height:32px;cursor:pointer;line-height:1">+</button>
    </div>` : ''}
  </div>`;
}

// Keep this house's request note in step: a request adds the item, "tap again to remove"
// takes it off, a quantity change updates it. The note itself is removed from the main app
// ("Delivered") — buying an item never removes it from the note.
function noteSet(key, name, qty) {
  const nowIso = new Date().toISOString();
  const patch = {[HOUSE.id]: {name: HOUSE.short, items: {[key]: {n: name, q: qty, at: nowIso}}}};
  if (!note || !note.since) patch[HOUSE.id].since = nowIso;
  return db.collection('teamData').doc('houseNotes').set(patch, {merge: true});
}
function noteQty(key, qty) {
  if (!note || !note.items || !note.items[key]) return;
  db.collection('teamData').doc('houseNotes').set({[HOUSE.id]: {items: {[key]: {q: qty}}}}, {merge: true}).catch(()=>{});
}
function noteRemove(key) {
  if (!note || !note.items || !note.items[key]) return;
  db.collection('teamData').doc('houseNotes').set({[HOUSE.id]: {items: {[key]: firebase.firestore.FieldValue.delete()}}}, {merge: true}).catch(()=>{});
}

function toggleItem(key, name) {
  const cur = shopState[key] || {};
  const nowChecked = !cur.checked;
  const newStatus = nowChecked ? 'To Buy' : 'In Stock';
  const newQty = cur.qty || 1;
  const newSource = nowChecked ? HOUSE.source : '';
  shopState[key] = {checked: nowChecked, status: newStatus, qty: newQty, source: newSource};
  render();
  db.collection('shopState').doc('state').set(
    {[key]: {checked: nowChecked, status: newStatus, qty: newQty, source: newSource}},
    {merge: true}
  ).then(() => {
    toast(nowChecked ? `🛒 Added to cart` : `✅ Removed from cart`);
  }).catch(e => {
    console.error('[house] Firestore write FAILED:', e);
    toast('❌ Could not sync — check connection');
  });
  if(nowChecked) {
    noteSet(key, name, newQty).catch(e => console.error('[house] note write failed:', e));
    db.collection('shopNotifQueue').add({
      title: '🏠 ' + HOUSE.name,
      body: `${name} needs restocking`,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      sent: false
    }).catch(() => {});
  } else {
    noteRemove(key);
  }
}

function changeQty(key, delta) {
  const cur = shopState[key] || {};
  const newQty = Math.max(1, (cur.qty || 1) + delta);
  shopState[key] = {...cur, qty: newQty};
  render();
  db.collection('shopState').doc('state').set(
    {[key]: {...cur, qty: newQty}},
    {merge: true}
  ).catch(e => console.error('[house] qty write FAILED:', e));
  noteQty(key, newQty);
}

function showAddForm() {
  view = 'add';
  render();
}

function renderAdd() {
  const storeOpts = STORES.map(s=>`<option value="${s}">${s}</option>`).join('');
  document.getElementById('app').innerHTML = `
    <div class="form-wrap">
      <div style="font-size:16px;font-weight:800;color:var(--t1);margin-bottom:4px">Add Item to List</div>
      <div style="font-size:12px;color:var(--t3);margin-bottom:16px">This will appear in the Groomers' shopping list under <b style="color:var(--t2)">${esc(HOUSE.name)}</b>.</div>
      <label>Item name *</label>
      <input type="text" id="inName" placeholder="e.g. Dish soap" autofocus>
      <label>Where to buy *</label>
      <select id="inStore" style="width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:11px 13px;color:var(--t1);font-size:15px;font-family:inherit;outline:none;appearance:none;-webkit-appearance:none">
        <option value="" disabled selected>Select a store…</option>
        ${storeOpts}
      </select>
      <label>Notes (optional)</label>
      <textarea id="inNotes" placeholder="Brand, size, any details for the groomer..."></textarea>
      <button class="save-btn" onclick="saveItem()">➕ Add to Shopping List</button>
      <button class="cancel-btn" onclick="cancelAdd()">Cancel</button>
    </div>`;
  setTimeout(()=>document.getElementById('inName')?.focus(), 80);
}

async function saveItem() {
  const name  = (document.getElementById('inName')?.value||'').trim();
  const store = (document.getElementById('inStore')?.value||'').trim();
  const notes = (document.getElementById('inNotes')?.value||'').trim();
  if(!name)  { toast('⚠️ Please enter an item name'); return; }
  if(!store) { toast('⚠️ Please select a store'); return; }

  const id = name.replace(/[^a-zA-Z0-9]/g,'_').toLowerCase().slice(0,60) + '_' + Date.now();
  try {
    await db.collection('shoppingCatalog').doc(id).set({
      item: name,
      notes: notes || '',
      store: store,
      cabinet: HOUSE.cabinet
    });
    // Notify via GitHub Actions push (works when main app is closed)
    db.collection('shopNotifQueue').add({
      title: '🏠 ' + HOUSE.name,
      body: `${name} added to the shopping list`,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      sent: false
    }).catch(() => {});
    toast('✅ Added to shopping list!');
    view = 'list';
    render();
  } catch(e) {
    toast('❌ Could not save — check connection');
  }
}

function cancelAdd() {
  view = 'list';
  render();
}

function goBack() {
  if(view !== 'list') { view = 'list'; render(); }
  else { try{window.close();}catch(e){} history.back(); }
}

render();
</script>
</body>
</html>
